[package]
name = "nexus_ssh_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexus_ssh_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "charset", "http2"] }
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
uuid = { version = "1.10", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry"] }
